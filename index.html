<!DOCTYPE html>
<html lang="en-US">
    <head>
     <title>Basketball Game</title>
     <link rel="icon" href="basketball.ico">
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <link rel="stylesheet" href="main.css">
     <script src="bscript.js"></script>
    </head>
    
    <body>
       <h1>BASKETBALL SCOREBOARD</h1> 
       
      <p class="instr">Click the button to add points</p>


    <div class="bag">
      <div id="home">
        <h2>HOME</h2>
        <p class="homeScore">24</p>
        <ul>
            <button id="one" onclick="add1Home()">+1</button>
            <button id="two" onclick="add2Home()">+2</button>
            <button id="three" onclick="add3Home()">+3</button>
        </ul>
      </div>

      <div id="guest">
        <h2>GUEST</h2>
        <p class="guestScore">18</p>
        <ul>
            <button id="one" onclick="add1Guest()">+1</button>
            <button id="two" onclick="add2Guest()">+2</button>
            <button id="three" onclick="add3Guest()">+3</button>
        </ul>
      </div>
    </div>
    
      <button id="reset" onclick="resetScoreboard()">Reset</button>
    </body>

</html>
